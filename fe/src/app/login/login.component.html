<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 relative overflow-hidden flex flex-col items-center justify-center p-6">
  <!-- Animated Background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl animate-pulse delay-700"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center justify-center gap-2 mb-10 group cursor-pointer">
      <div class="p-2 bg-blue-500/20 rounded-xl group-hover:bg-blue-500/30 transition-colors">
        <ng-icon [name]="Home" class="w-8 h-8 text-blue-300"></ng-icon>
      </div>
      <span class="text-3xl font-bold text-white tracking-tight">PlotFinder</span>
    </a>

    <!-- Login Card -->
    <div class="bg-white/5 border border-white/10 backdrop-blur-xl rounded-xl shadow-2xl p-2">
      <div class="p-6 space-y-1">
        <h3 class="text-3xl font-extrabold text-white">Welcome Back</h3>
        <p class="text-blue-200/60 font-medium">
          Enter your credentials to access your secure vault.
        </p>
      </div>
      <div class="p-6 pt-0">
        <form class="space-y-5">
          <div class="space-y-2">
            <label for="email" class="text-blue-200/60 ml-1 text-sm font-medium">Email Address</label>
            <div class="relative group">
              <ng-icon [name]="Mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-blue-300/40 group-focus-within:text-blue-400 transition-colors"></ng-icon>
              <input
                type="email"
                id="email"
                placeholder="name@company.com"
                class="flex h-12 w-full rounded-md border border-white/10 bg-white/5 px-3 py-2 text-sm text-white placeholder:text-white/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50 pl-11"
              />
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center px-1">
              <label for="password" class="text-blue-200/60 text-sm font-medium">Password</label>
              <button type="button" class="text-xs text-blue-400 hover:text-blue-300 font-medium bg-transparent border-none cursor-pointer">Forgot password?</button>
            </div>
            <div class="relative group">
              <ng-icon [name]="Lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-blue-300/40 group-focus-within:text-blue-400 transition-colors"></ng-icon>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                class="flex h-12 w-full rounded-md border border-white/10 bg-white/5 px-3 py-2 text-sm text-white placeholder:text-white/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/50 pl-11"
              />
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-blue-200/60 ml-1 text-sm font-medium">Access Level</label>
            <div class="relative">
              <select class="flex h-12 w-full items-center justify-between rounded-md border border-white/10 bg-white/5 px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 appearance-none">
                <option value="user" class="bg-slate-900 text-white">Property Explorer (User)</option>
                <option value="admin" class="bg-slate-900 text-white">Platform Admin</option>
                <option value="authority" class="bg-slate-900 text-white">Governing Authority</option>
              </select>
              <ng-icon name="heroChevronDown" class="absolute right-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40 pointer-events-none"></ng-icon>
            </div>
          </div>

          <div class="flex items-center space-x-2 px-1">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-white/20 bg-white/5 text-blue-600 focus:ring-blue-500/50" />
            <label for="remember" class="text-sm font-medium text-blue-200/60 cursor-pointer">
              Remember this device for 30 days
            </label>
          </div>

          <button class="w-full h-12 bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg rounded-md shadow-xl shadow-blue-600/20 transition-all flex items-center justify-center group">
            Sign In
            <ng-icon [name]="ArrowRight" class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform"></ng-icon>
          </button>
        </form>

      <div class="flex flex-col gap-4 border-t border-white/5 p-6 pt-6 mt-2">
        <p class="text-center text-sm text-blue-200/60">
          New to PlotFinder?
          <a routerLink="/register" class="text-blue-400 hover:text-blue-300 font-bold transition-colors cursor-pointer">
            Create an account
          </a>
        </p>
      </div>
    </div>

    <!-- Back to Home -->
    <a routerLink="/" class="inline-flex items-center gap-2 text-sm text-blue-200/40 hover:text-white transition-colors mt-8 mx-auto w-full justify-center cursor-pointer">
      ← Back to home
    </a>
  </div>
</div>
