<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 relative overflow-hidden">
  <!-- Animated Background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl animate-pulse delay-700"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 backdrop-blur-md bg-white/10 border-b border-white/20">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a routerLink="/" class="flex items-center gap-2">
        <ng-icon [name]="Home" class="w-8 h-8 text-blue-300"></ng-icon>
        <span class="text-2xl font-bold text-white">PlotFinder</span>
      </a>

      <div class="flex items-center gap-6">
        <a routerLink="/browse" class="text-blue-200 hover:text-white">
          Browse
        </a>

        <div class="relative">
          <ng-icon
            [name]="Bell"
            class="w-6 h-6 text-blue-200 cursor-pointer hover:text-white"
          ></ng-icon>

          <span
            class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-xs text-white flex items-center justify-center"
          >
            3
          </span>
        </div>

        <div class="flex items-center gap-2 text-white">
          <ng-icon
            [name]="User"
            class="w-6 h-6"
          ></ng-icon>

          <span class="font-medium">John Doe</span>
        </div>
      </div>
    </nav>
  </header>

  <div class="container mx-auto px-6 py-8 relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

      <!-- Sidebar -->
      <div class="lg:col-span-1">
        <div class="backdrop-blur-lg bg-white/10 rounded-2xl border border-white/20 p-6 shadow-xl">

          <div class="text-center mb-6">
            <div
              class="w-20 h-20 backdrop-blur-sm bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-white/30"
            >
              <ng-icon
                [name]="User"
                class="w-10 h-10 text-blue-300"
              ></ng-icon>
            </div>

            <h2 class="font-semibold text-white">John Doe</h2>

            <p class="text-sm text-blue-200">
              john.doe&#64;email.com
            </p>
          </div>

          <nav class="space-y-2">

            <a
              routerLink="/user/dashboard"
              class="flex items-center gap-3 px-4 py-3 bg-white/20 text-white rounded-xl border border-white/30"
            >
              <ng-icon
                [name]="Home"
                class="w-5 h-5"
              ></ng-icon>

              <span>Dashboard</span>
            </a>

            <a
              routerLink="/user/saved"
              class="flex items-center gap-3 px-4 py-3 text-blue-200 hover:bg-white/10 rounded-xl"
            >
              <ng-icon
                [name]="Heart"
                class="w-5 h-5"
              ></ng-icon>

              <span>Saved Properties</span>
            </a>

            <a
              routerLink="/user/documents"
              class="flex items-center gap-3 px-4 py-3 text-blue-200 hover:bg-white/10 rounded-xl"
            >
              <ng-icon
                [name]="FileText"
                class="w-5 h-5"
              ></ng-icon>

              <span>My Documents</span>
            </a>

            <a
              routerLink="/user/settings"
              class="flex items-center gap-3 px-4 py-3 text-blue-200 hover:bg-white/10 rounded-xl"
            >
              <ng-icon
                [name]="Settings"
                class="w-5 h-5"
              ></ng-icon>

              <span>Settings</span>
            </a>

            <a
              routerLink="/login"
              class="flex items-center gap-3 px-4 py-3 text-red-300 hover:bg-red-500/20 rounded-xl"
            >
              <ng-icon
                [name]="LogOut"
                class="w-5 h-5"
              ></ng-icon>

              <span>Logout</span>
            </a>

          </nav>
        </div>
      </div>

      <!-- Main Content -->
      <div class="lg:col-span-3 space-y-6">

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

          <div class="backdrop-blur-lg bg-white/10 rounded-2xl border border-white/20 p-6 shadow-xl">
            <div class="flex items-center justify-between">

              <div>
                <p class="text-sm text-blue-200 mb-1">
                  Saved Properties
                </p>

                <p class="text-3xl font-bold text-white">
                  {{ savedProperties.length }}
                </p>
              </div>

              <ng-icon
                [name]="Heart"
                class="w-12 h-12 text-blue-300 opacity-50"
              ></ng-icon>

            </div>
          </div>

          <div class="backdrop-blur-lg bg-white/10 rounded-2xl border border-white/20 p-6 shadow-xl">
            <div class="flex items-center justify-between">

              <div>
                <p class="text-sm text-blue-200 mb-1">
                  My Properties
                </p>

                <p class="text-3xl font-bold text-white">
                  {{ myProperties.length }}
                </p>
              </div>

              <ng-icon
                [name]="Home"
                class="w-12 h-12 text-green-300 opacity-50"
              ></ng-icon>

            </div>
          </div>

          <div class="backdrop-blur-lg bg-white/10 rounded-2xl border border-white/20 p-6 shadow-xl">
            <div class="flex items-center justify-between">

              <div>
                <p class="text-sm text-blue-200 mb-1">
                  Verified Docs
                </p>

                <p class="text-3xl font-bold text-white">
                  4
                </p>
              </div>

              <ng-icon
                [name]="Shield"
                class="w-12 h-12 text-purple-300 opacity-50"
              ></ng-icon>

            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
